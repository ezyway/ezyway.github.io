server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Caching for static assets (images, video, audio, fonts, css, js)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|xml|svg|webp|mp4|webm|wav|mp3|eot|woff|woff2|ttf|otf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # HTML files (no cache to make sure updates are immediately visible)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Default fallback routing
    location / {
        try_files $uri $uri/ =404;
    }
}
