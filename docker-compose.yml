services:
  portfolio:
    container_name: portfolio-ng
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./samples.html:/usr/share/nginx/html/samples.html:ro
      - ./favi.ico:/usr/share/nginx/html/favi.ico:ro
      - ./zfavicon.png:/usr/share/nginx/html/zfavicon.png:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./fonts:/usr/share/nginx/html/fonts:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./svg:/usr/share/nginx/html/svg:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
